  fee:
    label: Forfait annuel
    description: |
      Ce forfait permet l'utilisation des services de remplacement sans aucun frais de gestion supplémentaire pendant une durée de 12 mois. Il est rentabilisé dès lors que vous souhaitez effectuer plus de deux demandes par an.
  button:
    label: Demander un devis
