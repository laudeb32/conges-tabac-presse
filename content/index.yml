hero:
  title: Partez l'esprit tranquille, [on s'occupe de tout]{.block}
  description: Imprévu, souci de personnel ou besoin d'une pause ? [Faites confiance à nos services pour garantir la continuité de votre commerce.]{.block}
  links:
    pricing: Nos tarifs
    request: Travaillons ensemble
intro:
  headline: Nos forces
  title: Un réseau de plus de 150 entreprises et 250 remplaçants qualifiés
  description: |
    Depuis plus de 10 ans, notre mission reste la même : permettre aux gérants de bar-tabac-presse de prendre du repos en toute sérénité. Notre réseau, qui ne cesse de grandir, s'est construit autour d'une équipe de remplaçants qualifiés.
  features:
    - title: Efficacité
      description: Hier à Lille, aujourd'hui à Bordeaux, demain chez vous. Grâce à nos compétences, chaque jour, et ce partout en France, des gérants comme vous peuvent s'offrir des moments de détente bien mérités.
      icon: heroicons:rocket-launch-solid
    - title: Expertise
      description: Derrière votre comptoir, le relai sera assuré par un professionnel chevronné qui connaît votre quotidien sur le bout des doigts. Du premier client jusqu'à la fermeture, votre commerce conserve son rythme habituel, même en période d'affluence.
      icon: heroicons:academic-cap-solid
    - title: Flexibilité
      description: Vous gérez l'hébergement, on s'occupe du reste. Pour la fin de semaine ou dans trois mois, en urgence ou pour vos futures vacances, nous faisons tout notre possible pour trouver la solution qu'il vous faut. L'option hébergement à domicile vous garantit une sérénité absolue.
      icon: heroicons:home-modern-solid
testimonials:
  title: Collaborons ensemble !
  description: Découvrez pourquoi ces professionnels nous font confiance. Leur satisfaction est notre plus grande fierté, leur témoignage notre meilleure vitrine.
  items:
    - quote: J'ai toujours pu bénéficier d'une réactivité exceptionnelle, comme ce jour ou, suite à un abandon de poste, un remplaçant est arrivé dans la soirée ! C'est cette confiance qui fait que nous travaillons ensemble depuis plus de dix ans.
      user:
        name: Marie L.
        description: Buraliste dans l'Ain, partenaire depuis 2014
    - quote: La qualité des remplaçants avec lesquels j'ai été mis en relation a été au rendez-vous. Ils furent non seulement très professionnels mais également ouverts et sympathiques. Je les recommande chaudement !
      user:
        name: Anthony G.
        description: Buraliste dans le Bas-Rhin, partenaire depuis 2024
why:
  title: Pourquoi choisir Congés Tabac Presse ?
  features:
    - title: Tarification claire
      description: Nos tarifs sont compétitifs, sans frais cachés, et sont indiqués dans la section suivante sans engagement de votre part.
      icon: heroicons:document-currency-euro-solid
    - title: Réactivité garantie
      description: Nous mettons tout en œuvre pour accéder à votre demande et vous proposer une solution sous 48 heures.
      icon: heroicons:clock-solid
    - title: Suivi personnalisé
      description: Un interlocuteur unique suit votre dossier de A à Z, toujours disponible pour répondre à vos questions et s'adapter à vos besoins.
      icon: heroicons:lifebuoy-solid
    - title: Démarches facilitées
      description: |
        Une gestion administrative simplifiée au maximum, un contrat clair et une facturation simple : nous vous accompagnons tout au long du processus.
      icon: heroicons:document-check-solid
    - title: Approche moderne
      description: |
        Une prise en charge optimisée et des outils performants qui nous permettent de suivre les disponibilités de chacun : notre méthode de travail assure un traitement efficace de chaque demande, de la prise de contact à la clôture du remplacement.
      icon: heroicons:square-3-stack-3d-solid
pricing:
